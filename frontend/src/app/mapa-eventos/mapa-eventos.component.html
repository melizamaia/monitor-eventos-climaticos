<div class="mapa-container">
  <div #mapaEl class="mapa"></div>

  @if (carregando) {
    <div class="mapa-status mapa-status--carregando">Carregando eventos...</div>
  }

  @if (erro) {
    <div class="mapa-status mapa-status--erro">{{ erro }}</div>
  }

  <div class="mapa-controles">
    <label [class.mapa-controles--desabilitado]="heatmapIndisponivel">
      <input
        type="checkbox"
        [checked]="heatmapAtivo"
        [disabled]="heatmapIndisponivel"
        (change)="alternarHeatmap()"
      />
      Mapa de calor (temperatura)
    </label>
  </div>
</div>
